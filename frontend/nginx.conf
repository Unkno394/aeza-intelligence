# Same routing as the Vite dev proxy (vite.config.ts): Market Simulator serves
# /api/market/v1 and /api/market/v2, market_api serves the rest of /api.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS; variables in proxy_pass make nginx re-resolve service names,
    # so it starts before the backends and survives their restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $market_api http://api:3000;
    set $simulator http://simulator:8091;

    proxy_read_timeout 120s;

    location /api/market/v1/ { proxy_pass $simulator; }
    location /api/market/v2/ { proxy_pass $simulator; }
    location /api/ { proxy_pass $market_api; }

    # BrowserRouter: unknown paths render the SPA.
    location / { try_files $uri /index.html; }
}
