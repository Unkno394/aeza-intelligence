# Настройки приложения. Секретам здесь не место: они лежат в .env (см.
# .env.example). Порты и набор контейнеров задаются в docker-compose.yml.
# Compose монтирует этот файл в контейнеры; после изменения перезапусти их:
#   docker compose up -d api frontend
# Неизвестный ключ или неверное значение остановят API при старте с указанием
# ключа. Проверить, что прочиталось: cargo run --bin aeza_intelligence -- config

[server]
# Адрес, который открывают в браузере. Порт должен совпадать с портом
# фронтенда в docker-compose.yml (8080). С https:// фронтенд работает по HTTPS
# с certs/tls.crt и certs/tls.key (если их нет, создаётся самоподписанный
# сертификат), а обычный HTTP на этом порту перенаправляется на HTTPS.
# Только адрес без пути: cookie и проверка Origin привязаны к нему.
public_url = "https://127.0.0.1:8080"
# Сколько часов живёт вход, от 1 до 720.
session_hours = 12

[auth]
# Как входят администраторы. Доступ в любом режиме даёт активная запись в
# public.admins, а её роль (viewer, operator, superadmin) решает, что можно.
# "password" — email и пароль из public.admins (scripts/auth_user.sh add).
# "oidc"     — внешний OpenID-провайдер, см. [auth.oidc].
# "disabled" — без входа, любой запрос считается superadmin. Только для
#              разработки, никогда на доступном из сети хосте.
mode = "password"

# Первый администратор. Пока ни у одного админа нет пароля, при старте
# создаётся superadmin с этим логином; пароль — DEFAULT_USER_PASSWORD в .env
# (не короче 16 символов). Дальнейшие изменения этого админа сохраняются:
# перезапуск их не откатывает. В режимах "oidc" и "disabled" не используется,
# так что для смены режима достаточно поменять mode.
[auth.default_user]
enabled = true
login = "admin"

# Провайдер входа для mode = "oidc". По умолчанию — встроенный Keycloak, он
# запускается командой docker compose --profile sso up -d.
[auth.oidc]
# Адрес провайдера; API читает с него /.well-known/openid-configuration.
issuer = "http://127.0.0.1:8081/realms/aeza"
# ID, под которым это приложение зарегистрировано у провайдера. У провайдера
# нужно указать адрес возврата <public_url>/api/auth/callback. Если при
# регистрации провайдер выдал приложению пароль (client secret; встроенному
# Keycloak он не нужен, вход защищён PKCE), его кладут в .env как
# OIDC_CLIENT_SECRET.
client_id = "aeza-intelligence"
scopes = ["openid", "email", "profile"]
