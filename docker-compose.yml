# Use the existing PostgreSQL database from DATABASE_URL for both customer and
# market tables. On Linux, host networking lets containers reach 127.0.0.1.
#
#   docker compose run --rm migrate             # apply all migrations
#   docker compose run --rm seed                # load scripts/data.json into empty tables

name: aeza-intelligence

x-app: &app
  build: .
  image: aeza-intelligence:latest
  network_mode: host
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

services:
  migrate:
    <<: *app
    command: ["migrate"]

  api:
    <<: *app
    entrypoint: ["market_api"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  snapshots:
    <<: *app
    entrypoint: ["client_snapshot"]
    command: ["--schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  trends:
    <<: *app
    profiles: ["collectors"]
    entrypoint: ["search_interest"]
    command: ["schedule"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      TRENDSMCP_API_KEY: ${TRENDSMCP_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    <<: *app
    profiles: ["seed"]
    command: ["load", "/data/data.json"]
    volumes:
      - ./scripts:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
