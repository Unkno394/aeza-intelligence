# Everything starts with one command:
#
#   docker compose up -d --build        # then open server.public_url of config.toml
#
# Order: db (PostgreSQL) → migrate → seed (skipped when clients exist) →
# api, snapshots, market collectors, simulator → frontend on port 8080.
# Optional profiles: sso (Keycloak for auth.mode = "oidc") and demo.
#
# Settings live in config.toml, mounted read-only into the containers that
# read it; .env holds only secrets. Ports and profiles are set in this file.

name: aeza-intelligence

# The bundled db service unless DATABASE_URL names another PostgreSQL.
x-database-url: &database-url ${DATABASE_URL:-postgres://aeza:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5433/aeza}

# A missing config.toml is an error instead of an empty directory in its place.
x-config: &config
  type: bind
  # AEZA_CONFIG_FILE: another file for one run, as scripts/check_auth.sh does.
  source: ${AEZA_CONFIG_FILE:-./config.toml}
  target: /etc/aeza/config.toml
  read_only: true
  bind:
    create_host_path: false

x-app: &app
  build: .
  image: aeza-intelligence:latest
  network_mode: host
  environment:
    DATABASE_URL: *database-url
    AEZA_CONFIG: /etc/aeza/config.toml
  volumes:
    - *config
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeza
      POSTGRES_DB: aeza
      # Read only when the db-data volume is created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # The application services use the host network and reach it here.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeza -d aeza"]
      interval: 2s
      timeout: 5s
      retries: 30

  # OIDC provider for auth.mode = "oidc": docker compose --profile sso up -d.
  # The realm, the client and the analyst@aeza.local account are imported from
  # keycloak/ on the first start; afterwards Keycloak keeps its accounts in the
  # keycloak volume (scripts/auth_user.sh).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: ["sso"]
    restart: unless-stopped
    # keycloak/start.sh points the client's redirect URIs at server.public_url
    # of config.toml on every start.
    entrypoint: ["/opt/aeza/start.sh"]
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    # The browser and market_api (host network) both reach Keycloak at
    # http://127.0.0.1:8081, the auth.oidc.issuer of config.toml.
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      SSO_USER_PASSWORD: ${SSO_USER_PASSWORD:-}
    volumes:
      # /opt/keycloak/data belongs to the keycloak user in the image, so the
      # new volume gets the same owner.
      - keycloak:/opt/keycloak/data
      - ./keycloak/aeza-realm.json:/opt/keycloak/data/import/aeza-realm.json:ro
      - ./keycloak/start.sh:/opt/aeza/start.sh:ro
      - *config
    healthcheck:
      # Ready once start.sh has updated the client. The image has no curl; ask
      # the management port with bash alone.
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/aeza-client-ready &&
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure:5"

  seed:
    <<: *app
    command: ["load", "--skip-if-loaded", "/data/given/data.json"]
    volumes:
      - ./scripts:/data:ro

  api:
    <<: *app
    restart: unless-stopped
    entrypoint: ["market_api"]
    command: ["--listen", "0.0.0.0:3000"]
    environment:
      DATABASE_URL: *database-url
      AEZA_CONFIG: /etc/aeza/config.toml
      # [auth.default_user] and a confidential OIDC client.
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      keycloak:
        condition: service_healthy
        # Absent without the sso profile, e.g. with auth.mode = "password".
        required: false
      migrate:
        condition: service_completed_successfully

  snapshots:
    <<: *app
    restart: unless-stopped
    entrypoint: ["client_snapshot"]
    command: ["--schedule"]
    depends_on:
      seed:
        condition: service_completed_successfully

  demo-stream:
    <<: *app
    profiles: ["demo"]
    restart: unless-stopped
    entrypoint: ["demo_stream"]
    environment:
      DATABASE_URL: *database-url
      DEMO_STREAM_INTERVAL_SECONDS: ${DEMO_STREAM_INTERVAL_SECONDS:-15}
      DEMO_STREAM_CUSTOMERS: ${DEMO_STREAM_CUSTOMERS:-500}
      DEMO_STREAM_BATCH_SIZE: ${DEMO_STREAM_BATCH_SIZE:-50}
      DEMO_REPLAY_DAYS: ${DEMO_REPLAY_DAYS:-120}
      DEMO_REPLAY_DELAY_MS: ${DEMO_REPLAY_DELAY_MS:-0}
    depends_on:
      seed:
        condition: service_completed_successfully

  # Competitor tariffs and EUR→RUB rates, refreshed daily. A failed source is
  # logged and retried on the next round; already imported rows stay.
  market-collector:
    <<: *app
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    volumes:
      - ./market-simulator/data/market-snapshot.json:/data/market-snapshot.json:ro
    command:
      - |
        while true; do
          market_import aeza-snapshot --file /data/market-snapshot.json || echo "Aéza catalog import failed, retrying in 24h"
          market_import run --mode live --max-archives 0 || echo "market_import failed, retrying in 24h"
          market_fx || echo "market_fx failed, retrying in 24h"
          sleep 86400
        done

  # Search interest, collected only when TRENDSMCP_API_KEY is set in .env.
  trends:
    <<: *app
    restart: "on-failure:5"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$TRENDSMCP_API_KEY" ]; then
          echo "TRENDSMCP_API_KEY is not set: search interest collection is disabled"
          exit 0
        fi
        exec search_interest schedule
    environment:
      DATABASE_URL: *database-url
      TRENDSMCP_API_KEY: ${TRENDSMCP_API_KEY:-}

  simulator:
    build: ./market-simulator
    image: aeza-market-simulator:latest
    restart: unless-stopped

  # Serves the UI and proxies /api. With an https:// server.public_url it
  # serves HTTPS with ./certs/tls.crt and tls.key, generated as a self-signed
  # pair when missing. The published port must match server.public_url.
  frontend:
    build: ./frontend
    image: aeza-intelligence-frontend:latest
    restart: unless-stopped
    environment:
      AEZA_CONFIG: /etc/aeza/config.toml
    volumes:
      - ./certs:/certs
      - *config
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - simulator

volumes:
  db-data:
  keycloak:
