# Everything starts with one command:
#
#   docker compose up -d --build        # then open http://127.0.0.1:8080
#
# Order: existing PostgreSQL → migrate → seed (skipped when clients exist) →
# keycloak, api, snapshots, market collectors, simulator → frontend
# (FRONTEND_PORT).
#
# DATABASE_URL points to the existing PostgreSQL on the Linux host.
# Search interest is collected only when TRENDSMCP_API_KEY is set.

name: aeza-intelligence

x-database-url: &database-url ${DATABASE_URL:?Set DATABASE_URL in .env}

x-app: &app
  build: .
  image: aeza-intelligence:latest
  network_mode: host
  environment:
    DATABASE_URL: *database-url
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # Local OIDC provider. The realm, the client and the analyst@aeza.local
  # account are imported from keycloak/ on the first start; afterwards
  # Keycloak keeps its accounts in the keycloak volume (scripts/auth_user.sh).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    # The browser and market_api (host network) both reach Keycloak at
    # KEYCLOAK_URL, so the issuer they see is the same.
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    environment:
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://127.0.0.1:${KEYCLOAK_PORT:-8081}}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      SSO_USER_PASSWORD: ${SSO_USER_PASSWORD:?Set SSO_USER_PASSWORD in .env}
      KC_AEZA_PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:${FRONTEND_PORT:-8080}}
    volumes:
      # /opt/keycloak/data belongs to the keycloak user in the image, so the
      # new volume gets the same owner.
      - keycloak:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; ask the management port with bash alone.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  migrate:
    <<: *app
    command: ["migrate"]
    depends_on: []
    restart: "on-failure:5"

  seed:
    <<: *app
    command: ["load", "--skip-if-loaded", "/data/data.json"]
    volumes:
      - ./scripts:/data:ro

  api:
    <<: *app
    restart: unless-stopped
    entrypoint: ["market_api"]
    command: ["--listen", "0.0.0.0:3000"]
    # Login settings; see .env.example. By default the API signs in through the
    # bundled Keycloak. It refuses to start without OIDC or the local admin
    # unless AUTH_DISABLED=true.
    environment:
      DATABASE_URL: *database-url
      OIDC_ISSUER: ${OIDC_ISSUER:-${KEYCLOAK_URL:-http://127.0.0.1:${KEYCLOAK_PORT:-8081}}/realms/aeza}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-aeza-intelligence}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:${FRONTEND_PORT:-8080}}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      LOCAL_ADMIN_USER: ${LOCAL_ADMIN_USER:-}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
    depends_on:
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  snapshots:
    <<: *app
    restart: unless-stopped
    entrypoint: ["client_snapshot"]
    command: ["--schedule"]
    depends_on:
      seed:
        condition: service_completed_successfully

  demo-stream:
    <<: *app
    profiles: ["demo"]
    restart: unless-stopped
    entrypoint: ["demo_stream"]
    environment:
      DATABASE_URL: *database-url
      DEMO_STREAM_INTERVAL_SECONDS: ${DEMO_STREAM_INTERVAL_SECONDS:-15}
      DEMO_REPLAY_DAYS: ${DEMO_REPLAY_DAYS:-60}
      DEMO_REPLAY_DELAY_MS: ${DEMO_REPLAY_DELAY_MS:-200}
    depends_on:
      seed:
        condition: service_completed_successfully

  # Competitor tariffs and EUR→RUB rates, refreshed daily. A failed source is
  # logged and retried on the next round; already imported rows stay.
  market-collector:
    <<: *app
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    volumes:
      - ./market-simulator/data/market-snapshot.json:/data/market-snapshot.json:ro
    command:
      - |
        while true; do
          market_import aeza-snapshot --file /data/market-snapshot.json || echo "Aéza catalog import failed, retrying in 24h"
          market_import run --mode live --max-archives 0 || echo "market_import failed, retrying in 24h"
          market_fx || echo "market_fx failed, retrying in 24h"
          sleep 86400
        done

  trends:
    <<: *app
    restart: "on-failure:5"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$TRENDSMCP_API_KEY" ]; then
          echo "TRENDSMCP_API_KEY is not set: search interest collection is disabled"
          exit 0
        fi
        exec search_interest schedule
    environment:
      DATABASE_URL: *database-url
      TRENDSMCP_API_KEY: ${TRENDSMCP_API_KEY:-}

  simulator:
    build: ./market-simulator
    image: aeza-market-simulator:latest
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: aeza-intelligence-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - simulator

volumes:
  keycloak:
